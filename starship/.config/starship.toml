format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break\
$status\
$character
"""

[username]
show_always = true
format = "[$user]($style)"
style_user = "white"

[hostname]
ssh_only = false
format = "[@](green)[$hostname](red)[:](green)"

[directory]
truncation_length = 6

[git_branch]
style = "purple"
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
style = "purple"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[status]
disabled = false
format = "[$symbol$status]($style) "
style = "red"
